[project]
name = "snowflake-lesson"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OlawoyeTaofeek", email = "habephe21@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "apache-airflow==2.10.5",
    "apache-airflow-providers-apache-spark>=5.3.4",
    "apache-airflow-providers-docker>=4.4.5",
    "apache-airflow-providers-postgres>=6.4.1",
    "apache-airflow-providers-slack>=9.5.0",
    "apache-airflow-providers-snowflake>=6.6.1",
    "astro-sdk-python>=1.7.0",
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.13.0",
    "dbt-snowflake>=1.12.5",
    "holidays>=0.108",
    "jupysql>=0.11.1",
    "minio>=7.2.20",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "snowflake>=1.14.0",
    "snowflake-connector-python[secure-local-storage]>=4.8.1",
    "snowflake-snowpark-python>=1.56.0",
    "snowpipe-streaming>=1.9.1",
    "sqlalchemy>=1.4.54",
    "zstandard>=0.25.0",
]

[project.scripts]
snowflake-lesson = "snowflake_lesson:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
